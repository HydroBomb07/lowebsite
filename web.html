<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Love 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(to top right, #ffe0f0, #f7f2ff);
      font-family: 'Baloo 2', cursive;
      overflow: hidden;
      cursor: none;
    }

    .container {
      text-align: center;
      padding: 100px 20px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 2.8em;
      color: #d94f8a;
      margin-bottom: 20px;
    }

    .typewriter-text {
      font-size: 1.3em;
      font-weight: 600;
      color: #333;
      max-width: 600px;
      margin: 20px auto;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      animation: blink 0.8s step-end infinite;
      border-right: 2px solid #d94f8a;
      min-height: 6em;
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    .buttons {
      margin-top: 40px;
    }

    .buttons a {
      text-decoration: none;
      background: #ffc1dc;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 30px;
      font-weight: bold;
      color: #a03363;
      transition: background 0.3s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .buttons a:hover {
      background: #ffaad0;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
    }

    .cursor-heart {
      position: fixed;
      font-size: 20px;
      color: hotpink;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-100px);
        opacity: 0;
      }
    }

    #countdown {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ffc1dc;
      padding: 15px 25px;
      border-radius: 30px;
      font-weight: bold;
      color: #a03363;
      font-size: 1.1em;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <div id="countdown"></div>

  <div class="container">
    <h1>To My Favorite Person 💗</h1>
    <p class="typewriter-text" id="letter"></p>
    <div class="buttons">
      <a href="gallery.html">📸 Our Moments</a>
      <a href="quiz.html">💘 Quiz Time</a>
    </div>
  </div>

  <script>
    const message = `Hello Dear, Just a gentle reminder that
    You are my favorite everything.
    Every smile, every hug, every moment with you is precious to me.
    I am Grateful to have you in my life. I LOVE YOU. 
    This little website is just for you — because you deserve all the love in the world.`;

    let i = 0;
    function typeWriter() {
      if (i < message.length) {
        document.getElementById("letter").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
      }
    }
    typeWriter();
  </script>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const hearts = [];

    class Heart {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 100;
        this.size = Math.random() * 6 + 2;
        this.speed = Math.random() * 1 + 0.5;
        this.opacity = Math.random();
      }

      update() {
        this.y -= this.speed;
        if (this.y < -this.size) {
          this.y = canvas.height + this.size;
          this.x = Math.random() * canvas.width;
        }
      }

      draw() {
        ctx.fillStyle = `rgba(255, 105, 180, ${this.opacity})`;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.bezierCurveTo(this.x + this.size, this.y - this.size, this.x + this.size * 2, this.y + this.size, this.x, this.y + this.size * 2);
        ctx.bezierCurveTo(this.x - this.size * 2, this.y + this.size, this.x - this.size, this.y - this.size, this.x, this.y);
        ctx.fill();
      }
    }

    function initHearts() {
      for (let i = 0; i < 80; i++) {
        hearts.push(new Heart());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hearts.forEach(h => {
        h.update();
        h.draw();
      });
      requestAnimationFrame(animate);
    }

    initHearts();
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

  <script>
    document.addEventListener('mousemove', (e) => {
      const heart = document.createElement('div');
      heart.classList.add('cursor-heart');
      heart.innerHTML = '❤️';
      heart.style.left = e.pageX + 'px';
      heart.style.top = e.pageY + 'px';
      document.body.appendChild(heart);
      setTimeout(() => {
        heart.remove();
      }, 1000);
    });

    const balloonContainer = document.createElement('div');
    balloonContainer.style.position = 'fixed';
    balloonContainer.style.top = '0';
    balloonContainer.style.left = '0';
    balloonContainer.style.width = '100%';
    balloonContainer.style.height = '100%';
    balloonContainer.style.pointerEvents = 'none';
    balloonContainer.style.zIndex = '1';
    document.body.appendChild(balloonContainer);

    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.innerHTML = '💖';
      balloon.style.position = 'absolute';
      balloon.style.left = Math.random() * window.innerWidth + 'px';
      balloon.style.bottom = '-40px';
      balloon.style.fontSize = Math.random() * 20 + 24 + 'px';
      balloon.style.transition = `bottom 10s linear, opacity 0.4s ease-out`;
      balloon.style.pointerEvents = 'auto';
      balloon.style.cursor = 'pointer';

      balloon.addEventListener('click', () => {
        balloon.style.opacity = '0';
        balloon.style.transform = 'scale(1.8)';
        setTimeout(() => balloon.remove(), 300);
      });

      balloonContainer.appendChild(balloon);

      setTimeout(() => {
        balloon.style.bottom = window.innerHeight + 'px';
      }, 100);

      setTimeout(() => {
        if (balloon && balloon.parentElement) {
          balloon.remove();
        }
      }, 10000);
    }

    setInterval(createBalloon, 600);
  </script>

  <!-- Countdown Script -->
  <script>
    function updateCountdown() {
      const countdownElement = document.getElementById("countdown");
      const targetDate = new Date("July 17, 2025 00:00:00").getTime();
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        countdownElement.innerHTML = "We are meeting today! 💖";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.innerHTML = `Meeting in: ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
  <script>
  // Burst when page loads
  window.onload = () => {
    fireBurst();

    // extra burst after 1 second
    setTimeout(fireBurst, 1000);

    // start gentle falling confetti
    continuousConfetti();
  };

  function fireBurst() {
    confetti({
      particleCount: 200,
      spread: 100,
      origin: { y: 0.6 },
      colors: ['#ff69b4', '#ffc0cb', '#ffb6c1', '#ff1493']
    });
  }

  function continuousConfetti() {
    var duration = 10 * 1000; // 10 seconds
    var end = Date.now() + duration;

    (function frame() {
      confetti({
        particleCount: 2,
        angle: 60,
        spread: 55,
        origin: { x: 0 },
        colors: ['#ff69b4', '#ffc0cb', '#ff1493']
      });
      confetti({
        particleCount: 2,
        angle: 120,
        spread: 55,
        origin: { x: 1 },
        colors: ['#ff69b4', '#ffc0cb', '#ff1493']
      });

      if (Date.now() < end) {
        requestAnimationFrame(frame);
      }
    }());
  }
</script>
</body>
</html>
