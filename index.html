<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter If You Dare 👁️</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: black url('https://images.unsplash.com/photo-1573065160334-9f54788447b2?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') center/cover no-repeat;
      font-family: 'Creepster', cursive;
      color: #ff0000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Custom Cursor - Only for non-interactive elements */
    .custom-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #ff0000, transparent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: transform 0.1s ease;
      display: none; /* Hide on mobile */
    }

    @media (min-width: 769px) {
      body {
        cursor: none;
      }
      .custom-cursor {
        display: block;
      }
    }

    /* Fog Effect */
    .fog {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, 
        rgba(0,0,0,0.8) 0%, 
        rgba(20,20,20,0.6) 25%, 
        rgba(0,0,0,0.9) 50%, 
        rgba(30,0,0,0.7) 75%, 
        rgba(0,0,0,0.8) 100%);
      animation: fog-drift 20s ease-in-out infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes fog-drift {
      0%, 100% { opacity: 0.8; transform: translateX(0) scale(1); }
      50% { opacity: 0.6; transform: translateX(20px) scale(1.1); }
    }

    /* Main Content */
    .main-content {
      position: relative;
      z-index: 100; /* High z-index to ensure it's above everything */
      animation: float-content 6s ease-in-out infinite;
    }

    @keyframes float-content {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 4em;
      text-shadow: 
        0 0 15px #ff0000,
        0 0 30px #ff0000,
        0 0 45px #ff0000,
        2px 2px 0px #000;
      margin-bottom: 30px;
      animation: title-pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes title-pulse {
      0%, 100% { 
        text-shadow: 
          0 0 15px #ff0000,
          0 0 30px #ff0000,
          0 0 45px #ff0000,
          2px 2px 0px #000;
      }
      50% { 
        text-shadow: 
          0 0 25px #ff0000,
          0 0 50px #ff0000,
          0 0 75px #ff0000,
          0 0 100px #ff0000,
          2px 2px 0px #000;
      }
    }

    .input-container {
      position: relative;
      margin: 30px 0;
      z-index: 101; /* Even higher z-index for input container */
    }

    input[type="password"] {
      padding: 20px;
      font-size: 1.4em;
      border: 2px solid #ff0000;
      border-radius: 10px;
      background: rgba(17, 17, 17, 0.95) !important; /* Force background */
      color: #ff0000 !important; /* Force text color */
      box-shadow: 
        0 0 20px #ff0000,
        inset 0 0 20px rgba(255, 0, 0, 0.1);
      margin-top: 20px;
      font-family: 'Creepster', cursive;
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      position: relative;
      z-index: 102; /* Highest z-index for input */
      pointer-events: auto !important; /* Force pointer events */
      cursor: text !important; /* Force text cursor */
      width: 300px;
      max-width: 90vw;
    }

    input[type="password"]:focus {
      outline: none !important;
      box-shadow: 
        0 0 30px #ff0000,
        0 0 50px #ff0000,
        inset 0 0 30px rgba(255, 0, 0, 0.2);
      transform: scale(1.05);
      background: rgba(17, 17, 17, 0.98) !important;
    }

    input[type="password"]::placeholder {
      color: rgba(255, 0, 0, 0.7) !important;
    }

    /* Ensure input is always clickable */
    input[type="password"]::-webkit-input-placeholder { color: rgba(255, 0, 0, 0.7); }
    input[type="password"]::-moz-placeholder { color: rgba(255, 0, 0, 0.7); }
    input[type="password"]:-ms-input-placeholder { color: rgba(255, 0, 0, 0.7); }

    button {
      margin-top: 30px;
      padding: 15px 35px;
      font-size: 1.2em;
      background: linear-gradient(45deg, #8B0000, #FF0000, #8B0000);
      color: white;
      border: 2px solid #ff0000;
      border-radius: 10px;
      cursor: pointer !important;
      font-family: 'Creepster', cursive;
      box-shadow: 
        0 0 20px #ff0000,
        inset 0 0 10px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      z-index: 101;
      pointer-events: auto !important;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 
        0 0 30px #ff0000,
        0 0 50px #ff0000,
        inset 0 0 20px rgba(255, 255, 255, 0.2);
    }

    button:active {
      transform: scale(0.95);
    }

    .error {
      margin-top: 25px;
      color: #ff0000;
      font-size: 1.4em;
      text-shadow: 0 0 10px #ff0000;
      animation: error-shake 0.5s ease-in-out;
      pointer-events: none;
    }

    @keyframes error-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .glitch {
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0% { 
        text-shadow: 
          2px 2px #ff0000,
          -2px -2px #00ff00,
          0 0 15px #ff0000;
      }
      25% { 
        text-shadow: 
          -2px -2px #00ffff,
          2px 2px #ff00ff,
          0 0 25px #ff0000;
      }
      50% { 
        text-shadow: 
          2px -2px #0000ff,
          -2px 2px #ffff00,
          0 0 35px #ff0000;
      }
      75% { 
        text-shadow: 
          -2px 2px #ff00ff,
          2px -2px #00ff00,
          0 0 25px #ff0000;
      }
      100% { 
        text-shadow: 
          2px 2px #ff0000,
          -2px -2px #00ff00,
          0 0 15px #ff0000;
      }
    }

    /* Ghost Animations */
    .ghost {
      position: absolute;
      font-size: 3em;
      opacity: 0.7;
      z-index: 5; /* Low z-index so they stay behind interactive elements */
      pointer-events: none !important; /* Ensure ghosts don't interfere */
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .ghost1 {
      top: 10%;
      left: -100px;
      animation: ghost-float-right 15s infinite;
      animation-delay: 0s;
    }

    .ghost2 {
      top: 70%;
      right: -100px;
      animation: ghost-float-left 18s infinite;
      animation-delay: 3s;
    }

    .ghost3 {
      top: 30%;
      left: -100px;
      animation: ghost-diagonal 20s infinite;
      animation-delay: 6s;
    }

    .ghost4 {
      bottom: 20%;
      left: -100px;
      animation: ghost-wave 16s infinite;
      animation-delay: 9s;
    }

    .ghost5 {
      top: 50%;
      right: -100px;
      animation: ghost-spiral 22s infinite;
      animation-delay: 12s;
    }

    @keyframes ghost-float-right {
      0% { 
        left: -100px; 
        transform: translateY(0px) rotate(0deg); 
        opacity: 0;
      }
      10% { opacity: 0.7; }
      50% { 
        left: 50%; 
        transform: translateY(-20px) rotate(5deg); 
      }
      90% { opacity: 0.7; }
      100% { 
        left: calc(100% + 100px); 
        transform: translateY(0px) rotate(0deg); 
        opacity: 0;
      }
    }

    @keyframes ghost-float-left {
      0% { 
        right: -100px; 
        transform: translateY(0px) rotate(0deg); 
        opacity: 0;
      }
      10% { opacity: 0.6; }
      50% { 
        right: 50%; 
        transform: translateY(15px) rotate(-3deg); 
      }
      90% { opacity: 0.6; }
      100% { 
        right: calc(100% + 100px); 
        transform: translateY(0px) rotate(0deg); 
        opacity: 0;
      }
    }

    @keyframes ghost-diagonal {
      0% { 
        left: -100px; 
        top: 80%; 
        transform: scale(0.8) rotate(0deg); 
        opacity: 0;
      }
      10% { opacity: 0.5; }
      50% { 
        left: 50%; 
        top: 20%; 
        transform: scale(1.2) rotate(10deg); 
      }
      90% { opacity: 0.5; }
      100% { 
        left: calc(100% + 100px); 
        top: 10%; 
        transform: scale(0.8) rotate(0deg); 
        opacity: 0;
      }
    }

    @keyframes ghost-wave {
      0% { 
        left: -100px; 
        transform: translateY(0px) scale(1); 
        opacity: 0;
      }
      10% { opacity: 0.8; }
      25% { transform: translateY(-30px) scale(1.1); }
      50% { transform: translateY(20px) scale(0.9); }
      75% { transform: translateY(-15px) scale(1.05); }
      90% { opacity: 0.8; }
      100% { 
        left: calc(100% + 100px); 
        transform: translateY(0px) scale(1); 
        opacity: 0;
      }
    }

    @keyframes ghost-spiral {
      0% { 
        right: -100px; 
        transform: translateY(0px) rotate(0deg) scale(1); 
        opacity: 0;
      }
      10% { opacity: 0.6; }
      25% { 
        right: 75%; 
        transform: translateY(-40px) rotate(90deg) scale(1.2); 
      }
      50% { 
        right: 50%; 
        transform: translateY(0px) rotate(180deg) scale(0.8); 
      }
      75% { 
        right: 25%; 
        transform: translateY(30px) rotate(270deg) scale(1.1); 
      }
      90% { opacity: 0.6; }
      100% { 
        right: calc(100% + 100px); 
        transform: translateY(0px) rotate(360deg) scale(1); 
        opacity: 0;
      }
    }

    /* Spooky Eyes */
    .eyes {
      position: absolute;
      top: 15%;
      right: 10%;
      font-size: 2em;
      animation: blink-eyes 4s infinite;
      z-index: 8;
      pointer-events: none;
    }

    @keyframes blink-eyes {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0; }
    }

    /* Lightning Effect */
    .lightning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      opacity: 0;
      z-index: 15;
      animation: lightning-flash 8s infinite;
      pointer-events: none;
    }

    @keyframes lightning-flash {
      0%, 95%, 100% { opacity: 0; }
      96%, 97% { opacity: 1; }
      98%, 99% { opacity: 0; }
    }

    /* Creepy Text Shadows */
    .subtitle {
      font-size: 1.2em;
      margin-bottom: 20px;
      color: #ff6666;
      text-shadow: 0 0 10px #ff0000;
      animation: flicker 3s infinite;
      pointer-events: none;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
      75% { opacity: 0.9; }
    }

    /* Screen Distortion */
    @keyframes screen-distort {
      0%, 100% { 
        filter: hue-rotate(0deg) contrast(1) brightness(1); 
      }
      25% { 
        filter: hue-rotate(90deg) contrast(1.2) brightness(0.8); 
      }
      50% { 
        filter: hue-rotate(180deg) contrast(0.8) brightness(1.2); 
      }
      75% { 
        filter: hue-rotate(270deg) contrast(1.1) brightness(0.9); 
      }
    }

    body.distort {
      animation: screen-distort 0.5s ease-in-out;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      h1 { font-size: 2.5em; }
      .ghost { font-size: 2em; }
      input[type="password"] { 
        font-size: 1.1em; 
        padding: 15px; 
        width: 280px;
      }
      button { font-size: 1em; padding: 12px 25px; }
      
      /* Show normal cursor on mobile */
      body { cursor: auto !important; }
      .custom-cursor { display: none !important; }
    }

    @media (max-width: 480px) {
      input[type="password"] { 
        width: 250px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="custom-cursor" id="cursor"></div>
  
  <!-- Fog Effect -->
  <div class="fog"></div>
  
  <!-- Lightning Effect -->
  <div class="lightning"></div>
  
  <!-- Spooky Eyes -->
  <div class="eyes">👀</div>
  
  <!-- Roaming Ghosts -->
  <div class="ghost ghost1">👻</div>
  <div class="ghost ghost2">🌫️</div>
  <div class="ghost ghost3">💀</div>
  <div class="ghost ghost4">👻</div>
  <div class="ghost ghost5">🕷️</div>
  
  <!-- Main Content -->
  <div class="main-content">
    <h1 class="glitch">Enter If You Dare</h1>
    <p class="subtitle">The spirits are watching... 👁️‍🗨️</p>
    
    <div class="input-container">
      <input type="password" id="password" placeholder="🔐 Whisper the secret..." autocomplete="off">
    </div>
    
    <button onclick="checkPassword()" onmouseover="playHoverSound()">
      Unlock the Darkness
    </button>
    
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const correctPassword = "loveispass";
    let attempts = 0;
    const maxAttempts = 3;

    // Custom Cursor (only on desktop)
    if (window.innerWidth > 768) {
      const cursor = document.getElementById('cursor');
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      // Cursor effects on interactive elements
      const interactiveElements = document.querySelectorAll('input, button');
      interactiveElements.forEach(element => {
        element.addEventListener('mouseenter', () => {
          cursor.style.transform = 'scale(1.5)';
          cursor.style.background = 'radial-gradient(circle, #ff0000, #ff6666)';
          element.style.cursor = 'auto'; // Override custom cursor for input
        });
        
        element.addEventListener('mouseleave', () => {
          cursor.style.transform = 'scale(1)';
          cursor.style.background = 'radial-gradient(circle, #ff0000, transparent)';
        });
      });
    }

    // Spooky Sound Effects (using Web Audio API)
    function createSpookySound(frequency, duration) {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
        oscillator.type = 'sawtooth';
        
        gainNode.gain.setValueAtTime(0, audioContext.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.1, audioContext.currentTime + 0.1);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration);
      } catch (error) {
        console.log('Audio not supported');
      }
    }

    function playHoverSound() {
      createSpookySound(200, 0.2);
    }

    function playErrorSound() {
      createSpookySound(100, 0.5);
      setTimeout(() => createSpookySound(150, 0.3), 200);
    }

    function playSuccessSound() {
      createSpookySound(400, 0.3);
      setTimeout(() => createSpookySound(600, 0.3), 150);
      setTimeout(() => createSpookySound(800, 0.4), 300);
    }

    // Screen shake effect
    function shakeScreen() {
      document.body.style.animation = 'none';
      document.body.offsetHeight; // Trigger reflow
      document.body.style.animation = 'screen-distort 0.5s ease-in-out';
      
      setTimeout(() => {
        document.body.style.animation = '';
      }, 500);
    }

    // Enhanced password checking with horror effects
    function checkPassword() {
      const entered = document.getElementById("password").value;
      const errorMsg = document.getElementById("errorMsg");
      
      if (entered === correctPassword) {
        playSuccessSound();
        errorMsg.innerHTML = "✅ The darkness welcomes you...";
        errorMsg.style.color = "#00ff00";
        
        // Dramatic transition effect
        document.body.style.transition = "all 2s ease-in-out";
        document.body.style.filter = "brightness(0)";
        
        setTimeout(() => {
          window.location.href = "web.html";
        }, 2000);
        
      } else {
        attempts++;
        playErrorSound();
        shakeScreen();
        
        const errorMessages = [
          "❌ The spirits reject your offering...",
          "💀 Wrong! The ghosts grow restless...",
          "🕷️ Final chance... or face eternal darkness!"
        ];
        
        if (attempts <= maxAttempts) {
          errorMsg.innerHTML = errorMessages[attempts - 1];
          errorMsg.style.color = "#ff0000";
          
          // Add more ghosts on wrong attempts
          if (attempts === 2) {
            addExtraGhost();
          }
          
          if (attempts === maxAttempts) {
            setTimeout(() => {
              document.body.style.filter = "invert(1) hue-rotate(180deg)";
              setTimeout(() => {
                document.body.style.filter = "";
              }, 1000);
            }, 500);
          }
        }
        
        // Clear input with spooky effect
        const input = document.getElementById("password");
        input.style.background = "rgba(255, 0, 0, 0.3)";
        input.value = "";
        
        setTimeout(() => {
          input.style.background = "rgba(17, 17, 17, 0.95)";
        }, 1000);
      }
    }

    // Add extra ghost on wrong attempts
    function addExtraGhost() {
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.innerHTML = '☠️';
      ghost.style.fontSize = '4em';
      ghost.style.top = Math.random() * 80 + '%';
      ghost.style.left = '-100px';
      ghost.style.animation = 'ghost-float-right 8s ease-in-out';
      ghost.style.zIndex = '20';
      ghost.style.pointerEvents = 'none';
      
      document.body.appendChild(ghost);
      
      setTimeout(() => {
        ghost.remove();
      }, 8000);
    }

    // Enter key support
    document.getElementById("password").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });

    // Focus the input field on page load
    window.addEventListener('load', () => {
      document.getElementById("password").focus();
    });

    // Random spooky events
    setInterval(() => {
      if (Math.random() > 0.7) {
        createSpookySound(80 + Math.random() * 100, 0.3);
      }
    }, 5000);

    // Prevent right-click for added mystery
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      createSpookySound(50, 0.2);
    });

    // Welcome message
    setTimeout(() => {
      createSpookySound(300, 1);
    }, 1000);

    // Ensure input always works
    document.getElementById("password").addEventListener('click', function() {
      this.focus();
    });
  </script>
</body>
</html>
